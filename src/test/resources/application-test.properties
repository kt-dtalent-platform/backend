# 검증 전용 DB
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:backend;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
# 테스트 파일 저장소
app.storage-path=.data/test-files
# 외부 계정 및 분석 설정 제외
app.bootstrap.email=
app.bootstrap.password=
app.ocr.url=
app.ocr.key=
app.maintenance.enabled=false
app.rate-limit.enabled=false
app.antivirus.required=false
app.antivirus.host=
app.crypto.keys={"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}
