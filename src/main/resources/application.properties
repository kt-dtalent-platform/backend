spring.application.name=backend
app.storage.s3.enabled=${S3_ENABLED:false}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

# DB 접속 및 UTC 시간대
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/kt_scholarship?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 스키마 자동 변경 방지
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Instant도 위 UTC 기준으로 저장하게 한다. 기본값(TIMESTAMP_UTC)은 드라이버가 JVM 시간대로 바꿀 수 있음
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# 상태 확인 엔드포인트 한정 노출
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT 서명 키(Base64, 32바이트 이상)와 만료 시간
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:2h}
app.jwt.issuer=kt-scholarship-backend
