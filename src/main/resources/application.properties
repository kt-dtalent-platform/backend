spring.application.name=backend
app.storage.s3.enabled=${S3_ENABLED:false}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

# DB 접속 및 UTC 시간대
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/kt_scholarship?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 스키마 자동 변경 방지
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Instant도 위 UTC 기준으로 저장하게 한다. 기본값(TIMESTAMP_UTC)은 드라이버가 JVM 시간대로 바꿀 수 있음
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# 상태 확인 엔드포인트 한정 노출
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT 서명 키(Base64, 32바이트 이상)와 만료 시간
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:30m}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:14d}
app.jwt.issuer=kt-scholarship-backend

# 로그인 안내 메일: 등록과 분리하여 담당자가 발송 요청한 대상만 처리
app.login-mail.enabled=${LOGIN_MAIL_ENABLED:false}
app.login-mail.login-url=${LOGIN_MAIL_LOGIN_URL:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.health.mail.enabled=${LOGIN_MAIL_ENABLED:false}
