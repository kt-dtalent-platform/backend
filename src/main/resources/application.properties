spring.application.name=backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

# DB 접속 및 UTC 시간대
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/kt_scholarship?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 상태 확인 엔드포인트 한정 노출
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 업로드 용량 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=11MB
# 비공개 파일 저장소
app.storage-path=${FILE_STORAGE_PATH:.data/files}
# 브라우저 접근 허용 목록
app.cors-origins=${CORS_ALLOWED_ORIGINS:}
# 초기 담당자 계정
app.bootstrap.email=${BOOTSTRAP_MANAGER_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_MANAGER_PASSWORD:}
# 외부 문서 분석 연결
app.ocr.url=${OCR_URL:}
app.ocr.key=${OCR_API_KEY:}
