# 로컬 DB
services:
  mysql:
    image: mysql:8.0
    # 초기 접속 설정
    environment:
      MYSQL_DATABASE: kt_scholarship
      MYSQL_USER: ${DB_USERNAME:?Copy .env.example to .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    # 로컬 접속 범위
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    # 데이터 보존
    volumes:
      - mysql_data:/var/lib/mysql
    # DB 준비 상태
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D kt_scholarship -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

# DB 볼륨
volumes:
  mysql_data:
